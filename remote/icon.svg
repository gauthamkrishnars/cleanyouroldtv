<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Rich Royal Indigo-to-Violet 3D Depth Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="45%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Top Glow on Background -->
    <radialGradient id="topGlow" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Remote Body: Smooth Pearl White Clay -->
    <linearGradient id="remoteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- 3D Bevel Highlight -->
    <linearGradient id="bodyBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.3"/>
    </linearGradient>

    <!-- D-Pad Outer Gradient -->
    <linearGradient id="dpadOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- D-Pad Center Cyan Button -->
    <linearGradient id="dpadCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Power Button Coral Red -->
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Green Play Button -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Amber Star Button -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- 3D Soft Ambient Shadow -->
    <filter id="drop3D" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#090a1a" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#090a1a" flood-opacity="0.4"/>
    </filter>

    <!-- Button Inset Shadow -->
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#topGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Glowing Wi-Fi / Infrared Signal Waves Radiating from Remote -->
  <g stroke="#38bdf8" fill="none" stroke-linecap="round">
    <!-- Inner Wave -->
    <path d="M216 68 A46 46 0 0 1 296 68" stroke-width="5" stroke-opacity="0.95"/>
    <!-- Middle Wave -->
    <path d="M196 50 A72 72 0 0 1 316 50" stroke-width="5" stroke-opacity="0.65"/>
    <!-- Outer Wave -->
    <path d="M176 32 A100 100 0 0 1 336 32" stroke-width="5" stroke-opacity="0.35"/>
  </g>

  <!-- 3D Floating Remote Unit -->
  <g filter="url(#drop3D)">
    <!-- Main Pearl White 3D Chassis -->
    <rect x="162" y="86" width="188" height="364" rx="46" fill="url(#remoteBody)"/>
    <!-- Subtle 3D Edge Bevel -->
    <rect x="162" y="86" width="188" height="364" rx="46" fill="none" stroke="url(#bodyBevel)" stroke-width="3"/>

    <!-- Top Transmitter Bevel & Power Button -->
    <!-- Power Button (Vibrant Coral Red 3D Pill) -->
    <g transform="translate(196, 122)" filter="url(#btnShadow)">
      <circle r="15" fill="url(#powerGrad)"/>
      <!-- Power Icon -->
      <path d="M0 -7 L0 0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-5 -4 A7 7 0 1 0 5 -4" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Signal Indicator Dot (Cyan Glow) -->
    <circle cx="316" cy="122" r="6" fill="#0284c7" filter="url(#btnShadow)"/>
    <circle cx="316" cy="122" r="4" fill="#38bdf8"/>

    <!-- High-Contrast 3D Navigation Clickpad -->
    <g transform="translate(256, 218)" filter="url(#btnShadow)">
      <!-- Dark Blue/Slate D-Pad Ring -->
      <circle r="60" fill="url(#dpadOuter)" stroke="#334155" stroke-width="2"/>
      
      <!-- Direction Triangles (Vibrant White) -->
      <!-- Up -->
      <polygon points="0,-46 -7,-36 7,-36" fill="#f8fafc"/>
      <!-- Down -->
      <polygon points="0,46 -7,36 7,36" fill="#f8fafc"/>
      <!-- Left -->
      <polygon points="-46,0 -36,-7 -36,7" fill="#f8fafc"/>
      <!-- Right -->
      <polygon points="46,0 36,-7 36,7" fill="#f8fafc"/>

      <!-- Vibrant Cyan Center OK Button -->
      <circle r="27" fill="url(#dpadCenter)" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="-2" r="23" fill="#38bdf8" fill-opacity="0.25"/>
      <text x="0" y="5" font-size="13" font-family="-apple-system, system-ui, sans-serif" font-weight="800" fill="#ffffff" text-anchor="middle">OK</text>
    </g>

    <!-- Action Buttons Row 1 (Back & Home) -->
    <!-- Back Button (Slate Glass) -->
    <g transform="translate(206, 316)" filter="url(#btnShadow)">
      <circle r="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M4 -5 L-2 0 L4 5" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Home Button (Vibrant Indigo Glass) -->
    <g transform="translate(306, 316)" filter="url(#btnShadow)">
      <circle r="18" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M-6 2 L-6 6 L6 6 L6 2 L0 -4 Z" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- Action Buttons Row 2 (Play & Volume Rocker) -->
    <!-- Play Button (Vibrant Emerald Green) -->
    <g transform="translate(206, 368)" filter="url(#btnShadow)">
      <circle r="18" fill="url(#playGrad)"/>
      <polygon points="-2,-6 6,0 -2,6" fill="#ffffff"/>
    </g>

    <!-- Mute / Star Button (Vibrant Amber) -->
    <g transform="translate(306, 368)" filter="url(#btnShadow)">
      <circle r="18" fill="url(#starGrad)"/>
      <!-- Speaker Mute Icon -->
      <path d="M-5 -3 L-2 -3 L2 -6 L2 6 L-2 3 L-5 3 Z" fill="#ffffff"/>
    </g>

    <!-- Volume Pill (+ / - Rocker) -->
    <g transform="translate(256, 416)" filter="url(#btnShadow)">
      <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Minus -->
      <line x1="-26" y1="0" x2="-14" y2="0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <!-- Plus -->
      <line x1="14" y1="0" x2="26" y2="0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
      <line x1="20" y1="-6" x2="20" y2="6" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
